<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e24">
  <title>Mezclador de pinturas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎨 Mezclador de pinturas</h1>
  </header>

  <main>
    <section class="resultado-fijo" aria-live="polite">
      <div id="muestra" class="muestra">Elige de 2 a 4 pinturas</div>
      <p id="estado" class="estado"></p>
    </section>

    <section>
      <h2>Pinturas <span class="ayuda">(2 a 4)</span></h2>
      <input id="busqueda" type="search" placeholder="Buscar por código o nombre, ej. 70.950 o Black" autocomplete="off">
      <fieldset class="marcas">
        <legend>Marcas</legend>
        <div id="marcas"></div>
      </fieldset>
      <ul id="lista" class="lista" aria-label="Pinturas disponibles"></ul>
      <p id="contador" class="ayuda"></p>
    </section>

    <section>
      <h2>Proporciones</h2>
      <div id="deslizadores"></div>
    </section>

    <section>
      <h2>Receta</h2>
      <table class="receta">
        <thead>
          <tr><th>Marca</th><th>Línea</th><th>Código</th><th>Nombre</th><th>%</th></tr>
        </thead>
        <tbody id="receta"></tbody>
      </table>
    </section>
  </main>

  <footer class="pie">Funciona sin conexión después de la primera carga.</footer>

  <script src="mezcla.js"></script>
  <script src="app.js"></script>
</body>
</html>
